<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Certimens — Agent de rédaction</title>
    <link rel="stylesheet" href="ui.css">
    <style>
        body { width: 340px; padding: 16px; }
        h1 { font-size: 1.35rem; }
        h2 { font-size: 1.0625rem; font-weight: 700; letter-spacing: 0; }
        .brand .mark { width: 24px; height: 24px; }
        .card { padding: 16px; }
    </style>
</head>
<body class="stack" style="gap: 12px">
    <div class="brand">
        <img class="mark" src="icons/icon128.png" alt="">
        <h1>Certi<span class="mens">mens</span></h1>
    </div>

    <form id="login" class="card stack" hidden>
        <p class="muted">Connectez-vous à votre espace Certimens.</p>
        <div class="field">
            <label for="email">E-mail</label>
            <input id="email" type="email" required autocomplete="username">
        </div>
        <div class="field">
            <label for="password">Mot de passe</label>
            <input id="password" type="password" required autocomplete="current-password">
        </div>
        <div class="field">
            <label for="engineUrl">Adresse du moteur</label>
            <input id="engineUrl" type="url" required placeholder="https://monespace.certimens.fr">
        </div>
        <button type="submit" class="btn block">Se connecter</button>
    </form>

    <div id="account" class="stack" style="gap: 12px" hidden>
        <div class="row small">
            <span class="muted">Connecté : <strong id="who" style="color: var(--text)"></strong></span>
            <button type="button" id="logout" class="link small">Se déconnecter</button>
        </div>

        <div id="doc" class="card stack" hidden>
            <div class="muted small">Document ouvert</div>
            <div id="linked" class="stack" style="gap: 6px" hidden>
                <h2 id="linkedName"></h2>
                <div class="alert ok small">Fichier Certimens associé : les mesures y sont envoyées.</div>
                <div id="submitted" class="muted small" hidden></div>
                <a id="open" class="small" target="_blank" rel="noopener">Ouvrir dans Certimens</a>
                <div id="upload" class="stack" style="gap: 6px; margin-top: 6px">
                    <button type="button" id="exportDocx" class="btn outlined block" hidden>Envoyer le .docx</button>
                    <label id="pickDocx" class="btn outlined block" hidden>
                        Envoyer un .docx…
                        <input id="docxFile" type="file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
                    </label>
                    <div id="uploadHint" class="muted small"></div>
                </div>
            </div>
            <form id="create" class="stack" hidden>
                <div class="field">
                    <label for="documentName">Nom du fichier</label>
                    <input id="documentName" required>
                </div>
            </form>
            <div id="assignmentBox" class="field" hidden>
                <label for="assignment">Devoir</label>
                <select id="assignment"></select>
            </div>
            <button type="submit" form="create" id="createBtn" class="btn block" hidden>Créer le fichier</button>
            <button type="button" id="submit" class="btn block" hidden>Rendre sur ce devoir</button>
        </div>
        <div id="noDoc" class="card muted" hidden>Ouvrez un document Google Docs ou Word Online pour créer son fichier Certimens.</div>
    </div>

    <div id="message" class="alert small"></div>

    <button type="button" id="options" class="link small" style="align-self: flex-start">Paramètres et état de synchronisation</button>

    <script src="ui.js"></script>
    <script src="popup.js"></script>
</body>
</html>
